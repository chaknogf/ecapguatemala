# Synvapp ERP — despliegue aislado (compatible Podman 4+ y Docker 24+)
# Uso: podman-compose -f infra/compose.yml --env-file ../.env up -d
# La base de datos NO expone puerto públicamente por defecto.
name: synvapp

services:
  db:
    image: docker.io/library/postgres:18-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synvapp}
      POSTGRES_USER: ${POSTGRES_USER:-synvapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido en .env}
      TZ: UTC
    volumes:
      - synvapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synvapp} -d ${POSTGRES_DB:-synvapp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [synvapp_internal]
    # SIN puertos publicados: acceso solo desde la red interna.
    deploy:
      resources:
        limits:
          memory: 1g

  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: synvapp-api:local
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-synvapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-synvapp}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
    depends_on:
      db:
        condition: service_healthy
    networks: [synvapp_internal]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    image: synvapp-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-synvapp}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-synvapp}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-14}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
      UPLOAD_DIR: /srv/synvapp/data/uploads
      BACKUP_DIR: /srv/synvapp/data/backups
    volumes:
      - synvapp_data:/srv/synvapp/data
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [synvapp_internal]
    ports:
      # Solo interfaz de retorno: acceso local/cli sin exponer la red.
      - "127.0.0.1:${SYNVAPP_API_PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          memory: 1g

  # Interfaz Angular. IMPORTANTE: el frontend publicado consume los endpoints
  # LEGADOS (/api/products, sobre el servidor Hono congelado). La UI v1 contra
  # /api/v1 es Fase 7 pendiente. Este servicio es opcional mediante
  # `--profile web` para que una instalación sin UI no muestre accesos rotos.
  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    image: synvapp-web:local
    restart: unless-stopped
    ports:
      - "${SYNVAPP_HTTP_PORT:-8080}:80"
    depends_on: [api]
    networks: [synvapp_internal]

networks:
  synvapp_internal:
    driver: bridge

volumes:
  synvapp_pgdata:
  synvapp_data:
